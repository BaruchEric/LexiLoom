<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LexiLoom — Smart Daily Word Puzzles</title>
    <meta name="description" content="Smart word puzzle game with daily challenges, periodic word themes, custom avatars, streaks, offline play, rewarded ad hints, dark mode, and global & friends leaderboards." />
    <meta property="og:title" content="LexiLoom — Smart Daily Word Puzzles" />
    <meta property="og:description" content="Play daily smart word challenges, unlock curated word themes, build streaks, and compete on global & friends leaderboards — even offline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#176B52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LexiLoom" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('lexiloom_theme_mode_v1');
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7F5] text-[#131B23] dark:bg-[#0D131A] dark:text-[#F1F5F9] antialiased selection:bg-[#176B52]/20 dark:selection:bg-[#2EB88A]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
